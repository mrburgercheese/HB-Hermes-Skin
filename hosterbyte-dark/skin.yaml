# ==============================================================================
# Hosterbyte Dark Theme for Hermes Agent (Desktop / TUI / CLI)
# Inspired by img.hosterbyte.com — Dark Retro Evergreen & Vibrant Emerald Accent
# Repository: https://github.com/mrburgercheese/HB-Hermes-Skin
# ==============================================================================

name: hosterbyte-dark
version: 1.1.0
description: Hosterbyte Evergreen dark theme — deep forest canvas & vibrant emerald accent

colors:
  # Base Canvas & Surface
  background: "#122017"          # Deep evergreen dark canvas (velvety forest)

  # Brand Accent
  ui_accent: "#10b981"           # Vibrant emerald / fresh mint accent
  banner_accent: "#10b981"

  # Text Hierarchy
  banner_title: "#f4f8f3"        # Crisp herbal sage white headings
  ui_primary: "#f4f8f3"          # Primary white text
  banner_text: "#e1ece3"         # Soft mint-cream body text (low eye strain)
  ui_text: "#e1ece3"
  ui_label: "#e1ece3"
  banner_dim: "#7ca289"          # Eucalyptus sage secondary/muted text
  banner_border: "#224230"       # Subtle deep evergreen border
  ui_border: "#224230"

  # Semantic Status Colors
  ui_ok: "#10b981"               # Vibrant emerald / success
  ui_warn: "#fbbf24"             # Sunlight amber warning
  ui_error: "#e11d48"            # Retro crimson red (from img.hosterbyte.com)

  # CLI / TUI Chrome & Status Bar
  prompt: "#10b981"
  input_rule: "#10b981"
  response_border: "#10b981"
  status_bar_bg: "#0c1811"       # Ultra deep night forest bar
  status_bar_text: "#e1ece3"
  status_bar_good: "#10b981"
  status_bar_warn: "#fbbf24"
  status_bar_critical: "#e11d48"
  session_label: "#f4f8f3"
  session_border: "#224230"

  # Tool & Reasoning Elements
  ui_tool: "#10b981"             # Emerald tool marker
  ui_thinking: "#7ca289"         # Muted eucalyptus reasoning text

  # Code Syntax
  syntax_string: "#34d399"       # Fresh mint strings
  syntax_number: "#fbbf24"       # Sunlight amber numbers
  syntax_keyword: "#6ee7b7"      # Bright sage keywords
  syntax_comment: "#638973"      # Muted eucalyptus comments

  # Diffs
  diff_added: "#123723"
  diff_removed: "#45121b"
  diff_added_word: "#1b5335"
  diff_removed_word: "#691b29"

  # Completion Menu
  completion_menu_bg: "#16281e"
  completion_menu_current_bg: "#244533"

branding:
  agent_name: Lexa
  prompt_symbol: "❯"

tool_prefix: "┊"

customCSS: |
  /* ============================================================ */
  /* Hosterbyte Dark: Enhanced Running Arc & Stardust Sparks      */
  /* ============================================================ */
  .arc-border.arc-row,
  :root.dark .arc-border.arc-row {
    --arc-width: 2px !important;
    --arc-c0: rgba(16, 185, 129, 0) !important;
    --arc-c1: #10b981 !important;
    --arc-c2: #34d399 !important;
    --arc-duration: 2.2s !important;
    filter: drop-shadow(0 0 3px rgba(16, 185, 129, 0.85)) drop-shadow(0 0 8px rgba(16, 185, 129, 0.45));
    animation: hb-arc-pulse 2s ease-in-out infinite alternate !important;
  }

  .arc-border.arc-row::before {
    background:
      radial-gradient(circle 2px at 20% 25%, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
      radial-gradient(circle 1.5px at 60% 70%, #a7f3d0 0%, rgba(167, 243, 208, 0) 100%),
      radial-gradient(circle 2.5px at 80% 35%, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
      radial-gradient(circle 1.5px at 35% 80%, #6ee7b7 0%, rgba(110, 231, 183, 0) 100%),
      repeating-linear-gradient(
        var(--arc-angle),
        transparent 0%,
        rgba(16, 185, 129, 0) 14%,
        rgba(16, 185, 129, 0.4) 20%,
        #10b981 25%,
        #6ee7b7 28%,
        #ffffff 30%,
        #34d399 32%,
        rgba(16, 185, 129, 0.4) 37%,
        transparent 44%,
        transparent 50%
      ) !important;
    background-size: 80px 80px, 60px 60px, 90px 90px, 70px 70px, 100% 100% !important;
  }

  @keyframes hb-arc-pulse {
    0%, 100% {
      filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.7)) drop-shadow(0 0 6px rgba(16, 185, 129, 0.35));
    }
    50% {
      filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.95)) drop-shadow(0 0 10px rgba(52, 211, 153, 0.6));
    }
  }

  /* ============================================================ */
  /* Session Status Dot: 6px High-Contrast Outer Dimmer Halo      */
  /* ============================================================ */

  /* Ukuran dot seimbang 6px presisi */
  span[role="status"] {
    width: 6px !important;
    height: 6px !important;
    min-width: 6px !important;
    min-height: 6px !important;
    max-width: 6px !important;
    max-height: 6px !important;
    display: inline-block !important;
    border-radius: 9999px !important;
    box-sizing: border-box !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  /* 1. STATE WORKING (Aktif eksekusi): Vivid Electric Emerald (#00ff87) + Intense Halo */
  span[role="status"].bg-\(--ui-accent\),
  span[role="status"][class*="bg-(--ui-accent)"] {
    background-color: #00ff87 !important;
    border: none !important;
    animation: hb-dot-halo-emerald 2.0s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 2. STATE STALLED / BACKGROUND: Electric Emerald Hollow (Garis Tajam) */
  span[role="status"].border-\(--ui-accent\),
  span[role="status"][class*="border-(--ui-accent)"] {
    border: 2px solid #00ff87 !important;
    background-color: transparent !important;
    animation: hb-dot-halo-emerald 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 3. STATE NEEDS-INPUT (Butuh respon): Blazing Sun Amber/Orange (#ff9500) + Alert Pulse */
  span[role="status"].bg-amber-500,
  span[role="status"][class*="bg-amber-500"] {
    background-color: #ff9500 !important;
    border: none !important;
    animation: hb-dot-halo-amber 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 4. STATE UNREAD (Selesai belum dilihat): Cyber Magenta / Neon Purple (#d946ef) + Steady Glow */
  span[role="status"].bg-\(--ui-success\),
  span[role="status"][class*="bg-(--ui-success)"] {
    background-color: #d946ef !important;
    border: none !important;
    animation: hb-dot-halo-purple 2.6s ease-in-out infinite alternate !important;
  }

  /* High-Contrast Keyframes (Inti solid tajam, pancaran aura luar lebih jelas) */
  @keyframes hb-dot-halo-emerald {
    0%, 100% {
      box-shadow: 
        0 0 0 1px rgba(0, 255, 135, 0.5),
        0 0 4px rgba(0, 255, 135, 0.35);
    }
    50% {
      box-shadow: 
        0 0 0 2.5px rgba(0, 255, 135, 0.95),
        0 0 8px rgba(0, 255, 135, 0.85),
        0 0 16px rgba(0, 255, 135, 0.6);
    }
  }

  @keyframes hb-dot-halo-amber {
    0%, 100% {
      box-shadow: 
        0 0 0 1px rgba(255, 149, 0, 0.5),
        0 0 4px rgba(255, 149, 0, 0.35);
    }
    50% {
      box-shadow: 
        0 0 0 2.5px rgba(255, 149, 0, 0.95),
        0 0 9px rgba(255, 149, 0, 0.85),
        0 0 16px rgba(255, 149, 0, 0.6);
    }
  }

  /* ============================================================ */
  /* Mini Status Badge (Inline Pseudo-Element pada Baris Sesi)    */
  /* ============================================================ */

  /* Beri ruang di kanan baris agar teks judul sesi tidak menabrak badge */
  .row-hover:has(span[role="status"]),
  .row-hover[data-working="true"] {
    padding-right: 56px !important;
  }

  .row-hover:has(span[role="status"]):hover,
  .row-hover[data-working="true"]:hover {
    padding-right: 74px !important;
  }

  /* 1. STATE WORKING: [ WORKING ] */
  .row-hover:has(span[role="status"][class*="bg-(--ui-accent)"])::after,
  .row-hover:has(span[role="status"].bg-\(--ui-accent\))::after,
  .row-hover[data-working="true"]::after {
    content: 'WORKING' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(0, 255, 135, 0.22) !important;
    color: #00ff87 !important;
    border: 1px solid rgba(0, 255, 135, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 2. STATE NEEDS-INPUT: [ INPUT ] */
  .row-hover:has(span[role="status"][class*="bg-amber-500"])::after,
  .row-hover:has(span[role="status"].bg-amber-500)::after {
    content: 'INPUT' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(255, 149, 0, 0.22) !important;
    color: #ff9500 !important;
    border: 1px solid rgba(255, 149, 0, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 3. STATE UNREAD: [ NEW ] */
  .row-hover:has(span[role="status"][class*="bg-(--ui-success)"])::after,
  .row-hover:has(span[role="status"].bg-\(--ui-success\))::after {
    content: 'NEW' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(217, 70, 239, 0.22) !important;
    color: #d946ef !important;
    border: 1px solid rgba(217, 70, 239, 0.45) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 4. STATE STALLED: [ STALLED ] */
  .row-hover:has(span[role="status"][class*="border-(--ui-accent)"])::after,
  .row-hover:has(span[role="status"].border-\(--ui-accent\))::after {
    content: 'STALLED' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(0, 255, 135, 0.12) !important;
    color: #00ff87 !important;
    border: 1px dashed rgba(0, 255, 135, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* Penyesuaian untuk Card Mode (Inbox) agar badge tetap di header atas */
  .row-hover:has(.flex-col)::after {
    top: 9px !important;
    transform: none !important;
  }

  /* Geser badge ke kiri sedikit saat baris di-hover agar tidak tertutup tombol kebab (⋯) */
  .row-hover:hover::after {
    right: 26px !important;
  }

  /* Kompatibilitas jika ada elemen .hb-status-badge */
  .hb-status-badge {
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1px 4px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    margin-bottom: 2px !important;
    display: inline-block !important;
  }

  .hb-status-badge.badge-working {
    background: rgba(0, 255, 135, 0.22) !important;
    color: #00ff87 !important;
    border: 1px solid rgba(0, 255, 135, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  .hb-status-badge.badge-input {
    background: rgba(255, 149, 0, 0.22) !important;
    color: #ff9500 !important;
    border: 1px solid rgba(255, 149, 0, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  .hb-status-badge.badge-unread {
    background: rgba(217, 70, 239, 0.22) !important;
    color: #d946ef !important;
    border: 1px solid rgba(217, 70, 239, 0.45) !important;
  }

  .hb-status-badge.badge-stalled {
    background: rgba(0, 255, 135, 0.12) !important;
    color: #00ff87 !important;
    border: 1px dashed rgba(0, 255, 135, 0.4) !important;
  }

  @keyframes hb-badge-pulse {
    0%, 100% {
      opacity: 0.82;
      transform: translateY(-50%) scale(0.97);
    }
    50% {
      opacity: 1;
      transform: translateY(-50%) scale(1.03);
    }
  }
