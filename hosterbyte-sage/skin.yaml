# ==============================================================================
# Hosterbyte Sage Theme for Hermes Agent (Desktop / TUI / CLI)
# Inspired by img.hosterbyte.com — Light Retro Sage Green & Matcha Accent
# Repository: https://github.com/mrburgercheese/HB-Hermes-Skin
# ==============================================================================

name: hosterbyte-sage
version: 1.1.1
description: Hosterbyte Sage inspired light theme — herbal pastel & matcha green accent

colors:
  # Base Canvas & Surface
  background: "#f4f8f3"          # Hijau herbal pastel adem (canvas)

  # Brand Accent
  ui_accent: "#2e7d52"           # Matcha green primary
  banner_accent: "#2e7d52"

  # Text Hierarchy
  banner_title: "#132e20"        # Deep forest headings
  ui_primary: "#132e20"          # Deep forest primary text
  banner_text: "#132e20"         # Deep forest crisp body text
  ui_text: "#132e20"
  ui_label: "#132e20"
  banner_dim: "#527863"          # Eucalyptus slate secondary/muted text
  banner_border: "#bcd2bf"       # Muted sage border matching herbal canvas
  ui_border: "#bcd2bf"

  # Semantic Status Colors
  ui_ok: "#2e7d52"               # Matcha green / success
  ui_warn: "#b45309"             # Warm amber warning
  ui_error: "#e11d48"            # Retro crimson red (from img.hosterbyte.com)

  # CLI / TUI Chrome & Status Bar
  prompt: "#2e7d52"
  input_rule: "#2e7d52"
  response_border: "#2e7d52"
  status_bar_bg: "#ebf3ea"       # Soft matcha highlight
  status_bar_text: "#132e20"
  status_bar_good: "#2e7d52"
  status_bar_warn: "#b45309"
  status_bar_critical: "#e11d48"
  session_label: "#132e20"
  session_border: "#bcd2bf"

  # Tool & Reasoning Elements
  ui_tool: "#2e7d52"             # Matcha green tool marker
  ui_thinking: "#527863"         # Eucalyptus slate reasoning text

  # Code Syntax
  syntax_string: "#1e6b3b"       # Matcha green strings
  syntax_number: "#b45309"       # Warm amber numbers
  syntax_keyword: "#047857"      # Deep emerald keywords
  syntax_comment: "#6b8f78"      # Eucalyptus muted comments

  # Diffs
  diff_added: "#d1fae5"          # Soft mint badge
  diff_removed: "#ffe4e6"        # Soft crimson light
  diff_added_word: "#a7f3d0"
  diff_removed_word: "#fecdd3"

  # Completion Menu
  completion_menu_bg: "#ebf3ea"
  completion_menu_current_bg: "#d1fae5"

branding:
  agent_name: Lexa
  prompt_symbol: "❯"

tool_prefix: "┊"

customCSS: |
  /* ============================================================ */
  /* Hosterbyte Dark: Enhanced Running Arc & Stardust Sparks      */
  /* ============================================================ */
  .arc-border.arc-row,
  :root.dark .arc-border.arc-row {
    --arc-width: 2px !important;
    --arc-c0: rgba(16, 185, 129, 0) !important;
    --arc-c1: #10b981 !important;
    --arc-c2: #34d399 !important;
    --arc-duration: 2.2s !important;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.45), inset 0 0 4px rgba(16, 185, 129, 0.25) !important;
    animation: hb-arc-pulse 2.5s ease-in-out infinite alternate !important;
    will-change: opacity !important;
  }

  .arc-border.arc-row::before {
    background:
      radial-gradient(circle 2px at 20% 25%, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
      radial-gradient(circle 1.5px at 60% 70%, #a7f3d0 0%, rgba(167, 243, 208, 0) 100%),
      radial-gradient(circle 2.5px at 80% 35%, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
      radial-gradient(circle 1.5px at 35% 80%, #6ee7b7 0%, rgba(110, 231, 183, 0) 100%),
      repeating-linear-gradient(
        var(--arc-angle),
        transparent 0%,
        rgba(16, 185, 129, 0) 14%,
        rgba(16, 185, 129, 0.4) 20%,
        #10b981 25%,
        #6ee7b7 28%,
        #ffffff 30%,
        #34d399 32%,
        rgba(16, 185, 129, 0.4) 37%,
        transparent 44%,
        transparent 50%
      ) !important;
    background-size: 80px 80px, 60px 60px, 90px 90px, 70px 70px, 100% 100% !important;
  }

  @keyframes hb-arc-pulse {
    0%, 100% {
      opacity: 0.88;
    }
    50% {
      opacity: 1;
    }
  }

  /* ============================================================ */
  /* Session Status Dot: 6px High-Contrast Outer Dimmer Halo      */
  /* ============================================================ */

  /* Ukuran dot seimbang 6px presisi */
  span[role="status"] {
    width: 6px !important;
    height: 6px !important;
    min-width: 6px !important;
    min-height: 6px !important;
    max-width: 6px !important;
    max-height: 6px !important;
    display: inline-block !important;
    border-radius: 9999px !important;
    box-sizing: border-box !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  /* 1. STATE WORKING (Aktif eksekusi): Vivid Electric Emerald (#2e7d52) + Intense Halo */
  span[role="status"].bg-\(--ui-accent\),
  span[role="status"][class*="bg-(--ui-accent)"] {
    background-color: #2e7d52 !important;
    border: none !important;
    animation: hb-dot-halo-emerald 2.0s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 2. STATE STALLED / BACKGROUND: Electric Emerald Hollow (Garis Tajam) */
  span[role="status"].border-\(--ui-accent\),
  span[role="status"][class*="border-(--ui-accent)"] {
    border: 2px solid #2e7d52 !important;
    background-color: transparent !important;
    animation: hb-dot-halo-emerald 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 3. STATE NEEDS-INPUT (Butuh respon): Blazing Sun Amber/Orange (#b45309) + Alert Pulse */
  span[role="status"].bg-amber-500,
  span[role="status"][class*="bg-amber-500"] {
    background-color: #b45309 !important;
    border: none !important;
    animation: hb-dot-halo-amber 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  /* 4. STATE UNREAD (Selesai belum dilihat): Cyber Magenta / Neon Purple (#e11d48) + Steady Glow */
  span[role="status"].bg-\(--ui-success\),
  span[role="status"][class*="bg-(--ui-success)"] {
    background-color: #e11d48 !important;
    border: none !important;
    animation: hb-dot-halo-purple 2.6s ease-in-out infinite alternate !important;
  }

  /* High-Contrast Keyframes (Inti solid tajam, pancaran aura luar lebih jelas) */
  @keyframes hb-dot-halo-emerald {
    0%, 100% {
      box-shadow: 
        0 0 0 1px rgba(0, 255, 135, 0.5),
        0 0 4px rgba(0, 255, 135, 0.35);
    }
    50% {
      box-shadow: 
        0 0 0 2px rgba(0, 255, 135, 0.9),
        0 0 8px rgba(0, 255, 135, 0.7);
    }
  }

  @keyframes hb-dot-halo-amber {
    0%, 100% {
      box-shadow: 
        0 0 0 1px rgba(255, 149, 0, 0.5),
        0 0 4px rgba(255, 149, 0, 0.35);
    }
    50% {
      box-shadow: 
        0 0 0 2px rgba(255, 149, 0, 0.9),
        0 0 8px rgba(255, 149, 0, 0.7);
    }
  }

  /* ============================================================ */
  /* Mini Status Badge & Stacked Timestamp (Sesuai Diagram HB)   */
  /* Tata Letak 2-Baris Presisi Sesuai Gambar 1:                 */
  /*   Baris 1 Kanan: Badge Status (top: 7px, right: 8px)         */
  /*   Baris 2 Kanan: Jam Sesi "now" (top: 24px, right: 8px)      */
  /* ============================================================ */

  .row-hover {
    position: relative !important;
  }

  .row-hover:has(span[role="status"]),
  .row-hover[data-working="true"] {
    padding-right: 70px !important;
  }

  .row-hover:has(span[role="status"]):hover,
  .row-hover[data-working="true"]:hover {
    padding-right: 88px !important;
  }

  /* 1. STATE WORKING: Emerald Badge */
  .row-hover:has(span[role="status"][class*="bg-(--ui-accent)"])::after,
  .row-hover:has(span[role="status"].bg-\(--ui-accent\))::after,
  .row-hover[data-working="true"]::after {
    content: 'WORKING' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.18) !important;
    color: #2e7d52 !important;
    border: 1px solid rgba(46, 125, 82, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 2. STATE NEEDS-INPUT: Sun Amber Alert Badge */
  .row-hover:has(span[role="status"][class*="bg-amber-500"])::after,
  .row-hover:has(span[role="status"].bg-amber-500)::after {
    content: 'INPUT' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(180, 83, 9, 0.18) !important;
    color: #b45309 !important;
    border: 1px solid rgba(180, 83, 9, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 3. STATE UNREAD: Neon Magenta/Purple Badge */
  .row-hover:has(span[role="status"][class*="bg-(--ui-success)"])::after,
  .row-hover:has(span[role="status"].bg-\(--ui-success\))::after {
    content: 'NEW' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(225, 29, 72, 0.16) !important;
    color: #e11d48 !important;
    border: 1px solid rgba(225, 29, 72, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* 4. STATE STALLED / BACKGROUND: Hollow Emerald Dashed Badge */
  .row-hover:has(span[role="status"][class*="border-(--ui-accent)"])::after,
  .row-hover:has(span[role="status"].border-\(--ui-accent\))::after {
    content: 'STALLED' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.12) !important;
    color: #2e7d52 !important;
    border: 1px dashed rgba(46, 125, 82, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  /* Jam sesi (time): tepat berada di bawah status badge di baris kedua */
  .row-hover [data-row-actions] time,
  .row-hover time {
    position: absolute !important;
    right: 8px !important;
    top: 24px !important;
    bottom: auto !important;
    font-size: 9px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    color: var(--ui-text-tertiary, #527863) !important;
    line-height: 1 !important;
    z-index: 4 !important;
    text-align: right !important;
    transition: right 0.15s ease !important;
  }

  /* Geser badge dan time ke kiri saat baris di-hover agar tidak tertabrak tombol kebab (⋮) */
  .row-hover:hover::after {
    right: 26px !important;
  }
  .row-hover:hover [data-row-actions] time,
  .row-hover:hover time {
    right: 26px !important;
  }

  /* Tombol kebab menu (⋮) di pojok kanan */
  .row-hover button[data-session-actions] {
    position: absolute !important;
    right: 4px !important;
    bottom: 5px !important;
    z-index: 6 !important;
  }

  /* Proteksi Judul: Mencegah teks judul bertabrakan dengan badge kanan */
  .row-hover:has(span[role="status"]) span.truncate,
  .row-hover:has(span[role="status"]) div.truncate,
  .row-hover:has(span[role="status"]) [data-slot="sidebar-row-label"] {
    padding-right: 68px !important;
  }
  .row-hover:has(span[role="status"]):hover span.truncate,
  .row-hover:has(span[role="status"]):hover div.truncate,
  .row-hover:has(span[role="status"]):hover [data-slot="sidebar-row-label"] {
    padding-right: 86px !important;
  }

  /* Pembersihan: Sembunyikan preview pesan chat jika Card Mode sempat aktif */
  .row-hover:has(.flex-col) [class*="text-(--ui-text-quaternary)"] {
    display: none !important;
  }

  /* Kompatibilitas jika ada elemen .hb-status-badge */
  .hb-status-badge {
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1px 4px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    margin-bottom: 2px !important;
    display: inline-block !important;
  }

  .hb-status-badge.badge-working {
    background: rgba(46, 125, 82, 0.18) !important;
    color: #2e7d52 !important;
    border: 1px solid rgba(46, 125, 82, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  .hb-status-badge.badge-input {
    background: rgba(180, 83, 9, 0.18) !important;
    color: #b45309 !important;
    border: 1px solid rgba(180, 83, 9, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
  }

  .hb-status-badge.badge-unread {
    background: rgba(225, 29, 72, 0.16) !important;
    color: #e11d48 !important;
    border: 1px solid rgba(225, 29, 72, 0.4) !important;
  }

  .hb-status-badge.badge-stalled {
    background: rgba(46, 125, 82, 0.12) !important;
    color: #2e7d52 !important;
    border: 1px dashed rgba(46, 125, 82, 0.4) !important;
  }

  @keyframes hb-badge-pulse {
    0%, 100% {
      opacity: 0.85;
    }
    50% {
      opacity: 1;
    }
  }
