# ==============================================================================
# Hosterbyte Sage Theme for Hermes Agent (Desktop / TUI / CLI)
# Inspired by img.hosterbyte.com — Light Retro Sage Green & Matcha Accent
# Repository: https://github.com/mrburgercheese/HB-Hermes-Skin
# ==============================================================================

name: hosterbyte-sage
version: 1.1.1
description: Hosterbyte Sage inspired light theme — herbal pastel & matcha green accent

colors:
  # Base Canvas & Surface
  background: "#f4f8f3"          # Hijau herbal pastel adem (canvas)

  # Brand Accent
  ui_accent: "#2e7d52"           # Matcha green primary
  banner_accent: "#2e7d52"

  # Text Hierarchy
  banner_title: "#132e20"        # Deep forest headings
  ui_primary: "#132e20"          # Deep forest primary text
  banner_text: "#132e20"         # Deep forest crisp body text
  ui_text: "#132e20"
  ui_label: "#132e20"
  banner_dim: "#527863"          # Eucalyptus slate secondary/muted text
  banner_border: "#bcd2bf"       # Muted sage border matching herbal canvas
  ui_border: "#bcd2bf"

  # Semantic Status Colors
  ui_ok: "#2e7d52"               # Matcha green / success
  ui_warn: "#b45309"             # Warm amber warning
  ui_error: "#e11d48"            # Retro crimson red (from img.hosterbyte.com)

  # CLI / TUI Chrome & Status Bar
  prompt: "#2e7d52"
  input_rule: "#2e7d52"
  response_border: "#2e7d52"
  status_bar_bg: "#ebf3ea"       # Soft matcha highlight
  status_bar_text: "#132e20"
  status_bar_good: "#2e7d52"
  status_bar_warn: "#b45309"
  status_bar_critical: "#e11d48"
  session_label: "#132e20"
  session_border: "#bcd2bf"

  # Tool & Reasoning Elements
  ui_tool: "#2e7d52"             # Matcha green tool marker
  ui_thinking: "#527863"         # Eucalyptus slate reasoning text

  # Code Syntax
  syntax_string: "#1e6b3b"       # Matcha green strings
  syntax_number: "#b45309"       # Warm amber numbers
  syntax_keyword: "#047857"      # Deep emerald keywords
  syntax_comment: "#6b8f78"      # Eucalyptus muted comments

  # Diffs
  diff_added: "#d1fae5"          # Soft mint badge
  diff_removed: "#ffe4e6"        # Soft crimson light
  diff_added_word: "#a7f3d0"
  diff_removed_word: "#fecdd3"

  # Completion Menu
  completion_menu_bg: "#ebf3ea"
  completion_menu_current_bg: "#d1fae5"

branding:
  agent_name: Lexa
  prompt_symbol: "❯"

tool_prefix: "┊"

customCSS: |
  /* ============================================================ */
  /* Mini Status Badge (Inline Pseudo-Element pada Baris Sesi)    */
  /* ============================================================ */

  /* ============================================================ */
  /* Mini Status Badge & Stacked Timestamp (Sesuai Diagram HB)   */
  /* ============================================================ */

  /* ------------------------------------------------------------ */
  /* A. CARD MODE (Inbox Style 3 Baris):                          */
  /*    Atas Kanan: Badge [ WORKING ]                             */
  /*    Bawah Kanan: Jam sesi "now" (tepat di bawah badge)        */
  /* ------------------------------------------------------------ */
  .row-hover:has(.flex-col) {
    position: relative !important;
    padding-right: 68px !important;
  }

  .row-hover:has(.flex-col):has(span[role="status"][class*="bg-(--ui-accent)"])::after,
  .row-hover:has(.flex-col):has(span[role="status"].bg-\(--ui-accent\))::after,
  .row-hover:has(.flex-col)[data-working="true"]::after {
    content: 'WORKING' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.18) !important;
    color: #2e7d52 !important;
    border: 1px solid rgba(46, 125, 82, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
  }

  .row-hover:has(.flex-col):has(span[role="status"][class*="bg-amber-500"])::after,
  .row-hover:has(.flex-col):has(span[role="status"].bg-amber-500)::after {
    content: 'INPUT' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(180, 83, 9, 0.18) !important;
    color: #b45309 !important;
    border: 1px solid rgba(180, 83, 9, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
  }

  .row-hover:has(.flex-col):has(span[role="status"][class*="bg-(--ui-success)"])::after,
  .row-hover:has(.flex-col):has(span[role="status"].bg-\(--ui-success\))::after {
    content: 'NEW' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(225, 29, 72, 0.16) !important;
    color: #e11d48 !important;
    border: 1px solid rgba(225, 29, 72, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
  }

  .row-hover:has(.flex-col):has(span[role="status"][class*="border-(--ui-accent)"])::after,
  .row-hover:has(.flex-col):has(span[role="status"].border-\(--ui-accent\))::after {
    content: 'STALLED' !important;
    position: absolute !important;
    top: 7px !important;
    right: 8px !important;
    transform: none !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.12) !important;
    color: #2e7d52 !important;
    border: 1px dashed rgba(46, 125, 82, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
  }

  /* Jam sesi (time) ditempatkan tepat di bawah badge status di sisi kanan */
  .row-hover:has(.flex-col) [data-row-actions] time {
    position: absolute !important;
    right: 8px !important;
    top: 24px !important;
    font-size: 9px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    color: var(--ui-text-tertiary, #527863) !important;
    line-height: 1 !important;
    z-index: 4 !important;
  }

  .row-hover:has(.flex-col) button[data-session-actions] {
    position: absolute !important;
    right: 4px !important;
    bottom: 6px !important;
    z-index: 6 !important;
  }

  /* ------------------------------------------------------------ */
  /* B. FLAT MODE (1 Baris Ringkas):                             */
  /* ------------------------------------------------------------ */
  .row-hover:not(:has(.flex-col)):has(span[role="status"]),
  .row-hover:not(:has(.flex-col))[data-working="true"] {
    padding-right: 56px !important;
  }

  .row-hover:not(:has(.flex-col)):has(span[role="status"]):hover,
  .row-hover:not(:has(.flex-col))[data-working="true"]:hover {
    padding-right: 74px !important;
  }

  .row-hover:not(:has(.flex-col)):has(span[role="status"][class*="bg-(--ui-accent)"])::after,
  .row-hover:not(:has(.flex-col)):has(span[role="status"].bg-\(--ui-accent\))::after,
  .row-hover:not(:has(.flex-col))[data-working="true"]::after {
    content: 'WORKING' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.18) !important;
    color: #2e7d52 !important;
    border: 1px solid rgba(46, 125, 82, 0.45) !important;
    animation: hb-badge-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  .row-hover:not(:has(.flex-col)):has(span[role="status"][class*="bg-amber-500"])::after,
  .row-hover:not(:has(.flex-col)):has(span[role="status"].bg-amber-500)::after {
    content: 'INPUT' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(180, 83, 9, 0.18) !important;
    color: #b45309 !important;
    border: 1px solid rgba(180, 83, 9, 0.45) !important;
    animation: hb-badge-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  .row-hover:not(:has(.flex-col)):has(span[role="status"][class*="bg-(--ui-success)"])::after,
  .row-hover:not(:has(.flex-col)):has(span[role="status"].bg-\(--ui-success\))::after {
    content: 'NEW' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(225, 29, 72, 0.16) !important;
    color: #e11d48 !important;
    border: 1px solid rgba(225, 29, 72, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  .row-hover:not(:has(.flex-col)):has(span[role="status"][class*="border-(--ui-accent)"])::after,
  .row-hover:not(:has(.flex-col)):has(span[role="status"].border-\(--ui-accent\))::after {
    content: 'STALLED' !important;
    position: absolute !important;
    right: 8px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    font-size: 8px !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    font-weight: 700 !important;
    padding: 1.5px 4.5px !important;
    border-radius: 3px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    background: rgba(46, 125, 82, 0.12) !important;
    color: #2e7d52 !important;
    border: 1px dashed rgba(46, 125, 82, 0.4) !important;
    pointer-events: none !important;
    z-index: 5 !important;
    transition: right 0.15s ease !important;
  }

  .row-hover:not(:has(.flex-col)):hover::after {
    right: 26px !important;
  }

  @keyframes hb-badge-pulse {
    0%, 100% {
      opacity: 0.82;
      transform: scale(0.97);
    }
    50% {
      opacity: 1;
      transform: scale(1.03);
    }
  }
